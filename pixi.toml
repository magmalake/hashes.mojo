[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "hashes.mojo"
version = "0.1.0"
description = "Pure-Mojo CRC-32, MurmurHash3 x86-32, and XXH64 — the hashes Apache Iceberg and Parquet need."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, no FFI — consumers just `-I ../hashes.mojo/src`.
test = "mojo run -I src tests/test_hashes.mojo"

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is hashes-mojo; the Mojo import stays `from hashes import …`.
[package]
name = "hashes-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/hashes"
name = "hashes"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"

[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

# Benchmarks get their own feature so the harness tin stays out of the
# environments that run tests. -I $CONDA_PREFIX/lib/mojo is what puts the
# dependency's .mojopkg on the import path.
#
# Stable only, and for a packaging reason rather than a language one: a
# precompiled Mojo package is stamped with the compiler version that built it
# and refused by any other, and magmalake tins build with mojo-compiler 1.0.0.
# bench.mojo's own CI runs the harness on both toolchains from source.
[feature.bench.dependencies]
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "ec088a0b8ca7d21a1bf32f923528108e77473c4f" }

[feature.bench.tasks]
bench = "mojo run -I src -I $CONDA_PREFIX/lib/mojo bench/bench_hashes.mojo"

[environments]
default = ["nightly"]
stable = ["stable"]
bench = ["stable", "bench"]
