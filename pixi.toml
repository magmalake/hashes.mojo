[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "hashes.mojo"
version = "0.1.1"
description = "Pure-Mojo CRC-32, MurmurHash3 x86-32, and XXH64 — the hashes Apache Iceberg and Parquet need."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, no FFI — consumers just `-I ../hashes.mojo/src`.
test = "mojo run -I src tests/test_hashes.mojo"

# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
# `bench` is left out: bench/bench_hashes.mojo imports the `bench` package,
# which resolves only in the `bench` environment (via the built bench-mojo
# conda package) — an environment CI's matrix does not run — and the
# ../bench.mojo/src sibling is not checked out in CI either.
lint = { cmd = "mojolint --lsp -I src src tests" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is hashes-mojo; the Mojo import stays `from hashes import …`.
[package]
name = "hashes-mojo"
version = "0.1.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/hashes"
name = "hashes"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"

[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

# Benchmarks get their own feature so the harness tin stays out of the
# environments that run tests. -I $CONDA_PREFIX/lib/mojo is what puts the
# dependency's .mojopkg on the import path.
#
# Stable only, and for a packaging reason rather than a language one: a
# precompiled Mojo package is stamped with the compiler version that built it
# and refused by any other, and magmalake tins build with mojo-compiler 1.0.0.
# bench.mojo's own CI runs the harness on both toolchains from source.
[feature.bench.dependencies]
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "971759f58b862cfaa8fdef8708cd42f52ac719f9" }

[feature.bench.tasks]
bench = "mojo run -I src -I $CONDA_PREFIX/lib/mojo bench/bench_hashes.mojo"

[environments]
default = ["nightly"]
stable = ["stable"]
bench = ["stable", "bench"]

[dependencies]
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "3fa66644756c1de7aece83e5a89375323b6e0ce7" }
